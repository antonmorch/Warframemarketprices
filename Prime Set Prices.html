  const totOwned = [...owned].length;
  el("ownSummary").textContent = totOwned ? totOwned + " part" + (totOwned===1?"":"s") + " marked owned" : "";
  el("tbody").innerHTML = rs.map(r => {
    const dc = r.d==null ? "" : r.d>0 ? "d-good" : r.d<0 ? "d-bad" : "";
    const dc2 = r.drem==null ? "" : r.drem>0 ? "d-good" : r.drem<0 ? "d-bad" : "";
    const catlbl = r.c==="warframe" ? '<span class="cat">WF</span>' : r.c==="weapon" ? "" : '<span class="cat">comp</span>';
    let h = `<tr class="setrow" data-s="${r.s}">
      <td class="set-name">${r.n}${catlbl}</td>
      <td class="num">${r.sp ?? "—"}</td>
      <td class="num">${r.ps ?? "—"}${r.m?` <span style="color:#888">(${r.m} missing)</span>`:""}</td>
      <td class="num">${r.remCount===0 ? "✓ all owned" : r.remSum}</td>
      <td class="num ${dc}">${r.d==null?"—":r.d>0?"+":""}${r.d ?? "—"}</td>
      <td class="num ${dc2}">${r.drem==null?"—":r.drem>0?"+":""}${r.drem ?? "—"}</td>
      <td class="num ${dc}">${r.p==null?"—":r.p+"%"}</td></tr>`;
    if (expanded.has(r.s)) h += `<tr><td colspan="7" style="padding:.3rem 1rem;background:#22223a">` +
      r.parts.map(p => `<label class="partrow ${owned.has(p.id)?"owned":""}"><input type="checkbox" data-id="${p.id}" ${owned.has(p.id)?"checked":""}>${p.s}: <b>${p.pr ?? "—"}</b></label>`).join("") + `</td></tr>`;
    return h;
  }).join("");
  document.querySelectorAll(".setrow").forEach(tr => tr.onclick = () => {
    const s = tr.dataset.s; expanded.has(s) ? expanded.delete(s) : expanded.add(s); render();
  });
  document.querySelectorAll(".partrow input").forEach(cb => cb.onclick = e => {
    const id = cb.dataset.id;
    owned.has(id) ? owned.delete(id) : owned.add(id);
    saveOwned(); render();
  });
}
el("catToggle").querySelectorAll("button").forEach(b => b.onclick = () => {
  cat = b.dataset.v;
  el("catToggle").querySelectorAll("button").forEach(x => x.classList.toggle("on", x===b));
  render();
});
el("srcToggle").querySelectorAll("button").forEach(b => b.onclick = () => {
  mode = b.dataset.v;
  el("srcToggle").querySelectorAll("button").forEach(x => x.classList.toggle("on", x===b));
  render();
});
el("search").oninput = render;
el("profitOnly").onchange = render;
el("hideOwned").onchange = render;
el("clearOwned").onclick = () => { owned.clear(); saveOwned(); render(); };
document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
  if (sortKey === th.dataset.k) sortAsc = !sortAsc; else { sortKey = th.dataset.k; sortAsc = th.dataset.k === "n"; }
  render();
});
render();
</script></body></html>
